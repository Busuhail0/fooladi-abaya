[project]
name = "fooladi-abaya-cloud"
version = "1.1.0"
description = "Fooladi Abaya store and atelier management on Cloudflare"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.3",
  "Pillow>=11,<13",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = [
  "workers-py==1.17.3",
  "workers-runtime-sdk==1.8.4",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
