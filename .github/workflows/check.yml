name: Validate Fooladi
on:
  push:
    branches: [main, fix/worker-password-runtime]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-local.txt 'pytest>=8,<10'
      - run: python scripts/bundle_assets.py
      - run: python -m pytest -q
      - run: python -m compileall -q app.py ready_stock.py cloud_storage.py password_security.py worker.py bundled_assets.py
  worker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      FOOLADI_D1_DATABASE_ID: '00000000-0000-0000-0000-000000000000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync
      - run: python scripts/configure_d1.py
      - run: python scripts/bundle_assets.py
      - run: npm install --no-save --package-lock=false wrangler@4.136.3
      - name: Validate Worker without deploying
        run: uv run pywrangler deploy --dry-run
      - name: Exercise first account and login in the Workers runtime
        run: node scripts/smoke_worker.mjs
